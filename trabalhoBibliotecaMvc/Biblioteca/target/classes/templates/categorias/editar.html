<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-container">
    <header class="page-header">
        <span class="eyebrow">SISTEMA DE BIBLIOTECA</span>
        <h1>Editar Categoria</h1>
    <p class="page-description">Faça as alterações necessárias e salve o registro.</p>
    </header>
    <nav class="main-nav">
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>
    <main>
        <section class="content-section edit-section">
            <div class="section-heading"><div><span class="eyebrow">ALTERAÇÃO DE REGISTRO</span><h2>Atualize as informações</h2></div></div>
            <form class="data-form" th:action="@{/categorias/editar/{id}(id=${id})}" method="post" th:object="${categoriaExistente}">
                <div class="form-field"><label for="genero">Gênero</label><input type="text" id="genero" th:field="*{genero}" required></div>
                <div class="form-field"><label for="descricao">Descrição</label><input type="text" id="descricao" th:field="*{descricao}" required></div>
                <div class="form-field"><label for="classificacaoIndicativa">Classificação Indicativa</label>
                    <select id="classificacaoIndicativa" th:field="*{classificacaoIndicativa}">
                        <option value="Livre">Livre</option><option value="+10">Maiores de 10 anos</option>
                        <option value="+12">Maiores de 12 anos</option><option value="+14">Maiores de 14 anos</option>
                        <option value="+16">Maiores de 16 anos</option><option value="+18">Maiores de 18 anos</option>
                    </select>
                </div>
                <div class="form-actions"><button class="button-primary" type="submit">Atualizar Categoria</button><a class="button-secondary" th:href="@{/categorias}">Cancelar</a></div>
            </form>
        </section>
    </main>
    <footer class="page-footer">Sistema de Biblioteca</footer>
</div>
</body>
</html>
